name: todo

services:
  db:
    image: docker.io/pgvector/pgvector:pg16
    container_name: todo-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-todo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-todo}
    ports:
      # Bound to localhost only; the DB is not exposed to the network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Stored on the Desktop so it can be deleted by moving the folder to Trash.
      - ${HOME}/Desktop/volumes/todo/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-todo} -d ${POSTGRES_DB:-todo}"]
      interval: 5s
      timeout: 3s
      retries: 10
